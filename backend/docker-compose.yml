# Local development stack: backend API + PostgreSQL 16 + Redis.
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_NAME: royalsquare
      DB_USER: royalsquare
      DB_PASSWORD: local_dev_only
      REDIS_HOST: redis
      JWT_SECRET: dev_secret_change_me_012345678901234567890
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      AWS_REGION: af-south-1
      ENABLE_INTEGRATION_SIMULATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: royalsquare
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: royalsquare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royalsquare -d royalsquare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
